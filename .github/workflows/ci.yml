name: CI - Portfolio Win2K Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master, 'feature/**' ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Test Suite
        run: npm test
